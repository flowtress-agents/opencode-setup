[base]
image = "node:22-bookworm-slim"
image_tag = "node:22-bookworm"
image_digest = "sha256:node22-bookworm-stable"

[user]
name = "agent"
uid = 1000
gid = 1000
home = "/home/agent"
workdir = "/workspace"
shell = "/bin/bash"

[run]
detach = true
hostname = "sandbox-agent"
network_mode = "bridge"

[mounts.workspace]
host = '${PWD}/workspace'
container = "/home/agent/workspace"
readonly = false
